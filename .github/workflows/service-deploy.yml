# Reusable workflow: deploy a outcrop service to one or more environments, in order.
#
# Trigger it from the caller on `push: branches: [main]` (or `workflow_dispatch`).
#
# Behaviour
#   `environments` is an ordered, comma separated list (e.g. `dev,stage,prod`). A `plan` job
#   splits it and three explicit jobs `deploy-1` -> `deploy-2` -> `deploy-3` deploy one
#   environment each, in sequence; a job is skipped when its entry is absent. Each job is bound to
#   the GitHub Environment of the same name (`environment: <env>`), so required reviewers /
#   protection rules configured on that environment gate the deployment (e.g. approvals on `prod`).
#
#   Limitation: reusable workflows cannot create jobs dynamically, so at most THREE environments
#   are supported per call. Call the workflow twice for longer pipelines.
#
#   Role resolution per environment (first match wins):
#     1. `role-arns` input - newline separated `env=arn` pairs, e.g.
#          role-arns: |
#            dev=${{ vars.AWS_DEPLOY_ROLE_ARN_DEV }}
#            prod=${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
#     2. Repository/organisation variable `AWS_DEPLOY_ROLE_ARN_<ENV>` (upper-cased, `-` -> `_`),
#        e.g. `AWS_DEPLOY_ROLE_ARN_DEV`. `vars` is resolved in the caller's repository.
#
#   Each deploy job: checkout, install (+ optional build), OIDC login, `cdk deploy --all -c env=<env>`,
#   export stack outputs as `<output-prefix><Key>` environment variables, optional smoke test.
#
# Inputs
#   environments               Ordered comma separated list (default `dev`, max 3).
#   role-arns                  Newline separated `env=arn` pairs (optional, see above).
#   working-directory          CDK app directory (default `.`).
#   install-working-directory  Directory where `npm ci` runs (default: working-directory).
#   build-command              Optional build command run after install.
#   node-version               Node.js version; empty uses `.nvmrc`.
#   aws-region                 Required.
#   stacks, extra-context      Passed to `cdk deploy`.
#   smoke-test-command         Optional command run from working-directory after each deploy, with
#                              the stack outputs and `DEPLOY_ENV` in the environment.
#   output-prefix              Prefix for exported stack outputs (default `STACK_`).
#   cli-version / cli-command  How to run `@rpallas/outcrop-cli` for stack outputs (optional).
#   runs-on                    Runner label.
#
# Caller permissions required: contents: read, id-token: write.
#
# Example caller (service repository):
#   on:
#     push:
#       branches: [main]
#   jobs:
#     deploy:
#       uses: rpallas/outcrop/.github/workflows/service-deploy.yml@v1
#       with:
#         environments: dev,stage,prod
#         aws-region: ${{ vars.AWS_REGION }}
#         smoke-test-command: npm run test:smoke --if-present
#       permissions:
#         contents: read
#         id-token: write
#
# Implementation note: composite actions are checked out from the repository/commit this workflow
# runs from (`job.workflow_repository` @ `job.workflow_sha`) into `.outcrop`.
name: Service deploy

on:
  workflow_call:
    inputs:
      environments:
        description: Ordered comma separated list of environments (max 3).
        type: string
        required: false
        default: dev
      role-arns:
        description: Newline separated `env=arn` pairs overriding the `AWS_DEPLOY_ROLE_ARN_<ENV>` variables.
        type: string
        required: false
        default: ""
      working-directory:
        description: Directory containing the CDK app.
        type: string
        required: false
        default: .
      install-working-directory:
        description: Directory where `npm ci` runs (defaults to working-directory).
        type: string
        required: false
        default: ""
      build-command:
        description: Optional build command run from install-working-directory after install.
        type: string
        required: false
        default: ""
      node-version:
        description: Node.js version (empty = `.nvmrc`).
        type: string
        required: false
        default: ""
      aws-region:
        description: AWS region.
        type: string
        required: true
      stacks:
        description: Stacks to deploy (`--all` or a comma separated list / wildcards).
        type: string
        required: false
        default: --all
      extra-context:
        description: Newline separated `key=value` CDK context pairs.
        type: string
        required: false
        default: ""
      smoke-test-command:
        description: Optional smoke test command run from working-directory after each deploy.
        type: string
        required: false
        default: ""
      output-prefix:
        description: Prefix for exported stack outputs.
        type: string
        required: false
        default: STACK_
      runs-on:
        description: Runner label.
        type: string
        required: false
        default: ubuntu-latest
      cli-version:
        description: Version of `@rpallas/outcrop-cli` used for stack outputs (empty = jq/aws only).
        type: string
        required: false
        default: ""
      cli-command:
        description: Explicit CLI command (e.g. `node packages/outcrop-cli/bin/outcrop.js`).
        type: string
        required: false
        default: ""
    secrets: {}

jobs:
  plan:
    name: Plan environments
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      env1: ${{ steps.plan.outputs.env1 }}
      env2: ${{ steps.plan.outputs.env2 }}
      env3: ${{ steps.plan.outputs.env3 }}
      has1: ${{ steps.plan.outputs.has1 }}
      has2: ${{ steps.plan.outputs.has2 }}
      has3: ${{ steps.plan.outputs.has3 }}
      var1: ${{ steps.plan.outputs.var1 }}
      var2: ${{ steps.plan.outputs.var2 }}
      var3: ${{ steps.plan.outputs.var3 }}
      role1: ${{ steps.plan.outputs.role1 }}
      role2: ${{ steps.plan.outputs.role2 }}
      role3: ${{ steps.plan.outputs.role3 }}
    steps:
      - name: Split environment list
        id: plan
        env:
          ENVIRONMENTS: ${{ inputs.environments }}
          ROLE_ARNS: ${{ inputs.role-arns }}
        run: |
          set -euo pipefail
          read -r -a envs <<< "$(printf '%s' "$ENVIRONMENTS" | tr ',' ' ')"
          if [ "${#envs[@]}" -eq 0 ]; then
            echo "::error::input 'environments' must contain at least one environment"
            exit 1
          fi
          if [ "${#envs[@]}" -gt 3 ]; then
            echo "::error::at most 3 environments are supported per call (got ${#envs[@]}: ${envs[*]})"
            exit 1
          fi
          lookup_role() {
            local wanted="$1" line key
            while IFS= read -r line; do
              line="$(printf '%s' "$line" | tr -d '[:space:]')"
              key="${line%%=*}"
              if [ -n "$line" ] && [ "$key" = "$wanted" ]; then
                printf '%s' "${line#*=}"
                return 0
              fi
            done <<< "$ROLE_ARNS"
            return 0
          }
          {
            echo "### Deployment plan"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3; do
            name="${envs[i-1]:-}"
            if [ -n "$name" ]; then
              if ! [[ "$name" =~ ^[A-Za-z0-9_-]+$ ]]; then
                echo "::error::invalid environment name '$name'"
                exit 1
              fi
              var="AWS_DEPLOY_ROLE_ARN_$(printf '%s' "$name" | tr '[:lower:]-' '[:upper:]_')"
              role="$(lookup_role "$name")"
              {
                echo "env$i=$name"
                echo "has$i=true"
                echo "var$i=$var"
                echo "role$i=$role"
              } >> "$GITHUB_OUTPUT"
              if [ -n "$role" ]; then
                echo "$i. $name (role from role-arns input)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "$i. $name (role from variable $var)" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              {
                echo "env$i="
                echo "has$i=false"
                echo "var$i="
                echo "role$i="
              } >> "$GITHUB_OUTPUT"
            fi
          done

  deploy-1:
    name: Deploy ${{ needs.plan.outputs.env1 }}
    needs: plan
    if: needs.plan.outputs.has1 == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    environment: ${{ needs.plan.outputs.env1 }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.working-directory }}-${{ needs.plan.outputs.env1 }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env1 }}
      ROLE_ARN: ${{ needs.plan.outputs.role1 || vars[needs.plan.outputs.var1] }}
      ROLE_VAR: ${{ needs.plan.outputs.var1 }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve deploy role
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::No deploy role for environment '$DEPLOY_ENV'. Pass it via the 'role-arns' input ($DEPLOY_ENV=arn:...) or define the repository variable $ROLE_VAR."
            exit 1
          fi

      - name: Locate outcrop actions
        id: outcrop
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          repository="$(jq -r '.workflow_repository // empty' <<< "$JOB_CONTEXT")"
          ref="$(jq -r '.workflow_sha // empty' <<< "$JOB_CONTEXT")"
          if [ -z "$repository" ] || [ -z "$ref" ]; then
            echo "::warning::job.workflow_repository / job.workflow_sha are unavailable; using rpallas/outcrop@v1"
            repository="rpallas/outcrop"
            ref="v1"
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out outcrop actions
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.outcrop.outputs.repository }}
          ref: ${{ steps.outcrop.outputs.ref }}
          path: .outcrop
          sparse-checkout: .github/actions

      - name: Setup Node.js and install
        uses: ./.outcrop/.github/actions/setup-node-project
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.install-working-directory || inputs.working-directory }}

      - name: Build
        if: inputs.build-command != ''
        working-directory: ${{ inputs.install-working-directory || inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: eval "$BUILD_COMMAND"

      - name: AWS login
        uses: ./.outcrop/.github/actions/aws-oidc-login
        with:
          role-arn: ${{ env.ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: cdk deploy
        id: deploy
        uses: ./.outcrop/.github/actions/cdk-deploy
        with:
          working-directory: ${{ inputs.working-directory }}
          env: ${{ env.DEPLOY_ENV }}
          stacks: ${{ inputs.stacks }}
          extra-context: ${{ inputs.extra-context }}

      - name: Export stack outputs
        uses: ./.outcrop/.github/actions/stack-outputs
        with:
          outputs-file: ${{ steps.deploy.outputs.outputs-file }}
          prefix: ${{ inputs.output-prefix }}
          cli-version: ${{ inputs.cli-version }}
          cli-command: ${{ inputs.cli-command }}
          working-directory: ${{ inputs.working-directory }}

      - name: Smoke test
        if: inputs.smoke-test-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          SMOKE_TEST_COMMAND: ${{ inputs.smoke-test-command }}
          CI: "true"
        run: eval "$SMOKE_TEST_COMMAND"

  deploy-2:
    name: Deploy ${{ needs.plan.outputs.env2 }}
    needs: [plan, deploy-1]
    if: needs.plan.outputs.has2 == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    environment: ${{ needs.plan.outputs.env2 }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.working-directory }}-${{ needs.plan.outputs.env2 }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env2 }}
      ROLE_ARN: ${{ needs.plan.outputs.role2 || vars[needs.plan.outputs.var2] }}
      ROLE_VAR: ${{ needs.plan.outputs.var2 }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve deploy role
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::No deploy role for environment '$DEPLOY_ENV'. Pass it via the 'role-arns' input ($DEPLOY_ENV=arn:...) or define the repository variable $ROLE_VAR."
            exit 1
          fi

      - name: Locate outcrop actions
        id: outcrop
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          repository="$(jq -r '.workflow_repository // empty' <<< "$JOB_CONTEXT")"
          ref="$(jq -r '.workflow_sha // empty' <<< "$JOB_CONTEXT")"
          if [ -z "$repository" ] || [ -z "$ref" ]; then
            echo "::warning::job.workflow_repository / job.workflow_sha are unavailable; using rpallas/outcrop@v1"
            repository="rpallas/outcrop"
            ref="v1"
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out outcrop actions
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.outcrop.outputs.repository }}
          ref: ${{ steps.outcrop.outputs.ref }}
          path: .outcrop
          sparse-checkout: .github/actions

      - name: Setup Node.js and install
        uses: ./.outcrop/.github/actions/setup-node-project
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.install-working-directory || inputs.working-directory }}

      - name: Build
        if: inputs.build-command != ''
        working-directory: ${{ inputs.install-working-directory || inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: eval "$BUILD_COMMAND"

      - name: AWS login
        uses: ./.outcrop/.github/actions/aws-oidc-login
        with:
          role-arn: ${{ env.ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: cdk deploy
        id: deploy
        uses: ./.outcrop/.github/actions/cdk-deploy
        with:
          working-directory: ${{ inputs.working-directory }}
          env: ${{ env.DEPLOY_ENV }}
          stacks: ${{ inputs.stacks }}
          extra-context: ${{ inputs.extra-context }}

      - name: Export stack outputs
        uses: ./.outcrop/.github/actions/stack-outputs
        with:
          outputs-file: ${{ steps.deploy.outputs.outputs-file }}
          prefix: ${{ inputs.output-prefix }}
          cli-version: ${{ inputs.cli-version }}
          cli-command: ${{ inputs.cli-command }}
          working-directory: ${{ inputs.working-directory }}

      - name: Smoke test
        if: inputs.smoke-test-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          SMOKE_TEST_COMMAND: ${{ inputs.smoke-test-command }}
          CI: "true"
        run: eval "$SMOKE_TEST_COMMAND"

  deploy-3:
    name: Deploy ${{ needs.plan.outputs.env3 }}
    needs: [plan, deploy-2]
    if: needs.plan.outputs.has3 == 'true'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    environment: ${{ needs.plan.outputs.env3 }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.working-directory }}-${{ needs.plan.outputs.env3 }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ needs.plan.outputs.env3 }}
      ROLE_ARN: ${{ needs.plan.outputs.role3 || vars[needs.plan.outputs.var3] }}
      ROLE_VAR: ${{ needs.plan.outputs.var3 }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve deploy role
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::No deploy role for environment '$DEPLOY_ENV'. Pass it via the 'role-arns' input ($DEPLOY_ENV=arn:...) or define the repository variable $ROLE_VAR."
            exit 1
          fi

      - name: Locate outcrop actions
        id: outcrop
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          repository="$(jq -r '.workflow_repository // empty' <<< "$JOB_CONTEXT")"
          ref="$(jq -r '.workflow_sha // empty' <<< "$JOB_CONTEXT")"
          if [ -z "$repository" ] || [ -z "$ref" ]; then
            echo "::warning::job.workflow_repository / job.workflow_sha are unavailable; using rpallas/outcrop@v1"
            repository="rpallas/outcrop"
            ref="v1"
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out outcrop actions
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.outcrop.outputs.repository }}
          ref: ${{ steps.outcrop.outputs.ref }}
          path: .outcrop
          sparse-checkout: .github/actions

      - name: Setup Node.js and install
        uses: ./.outcrop/.github/actions/setup-node-project
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.install-working-directory || inputs.working-directory }}

      - name: Build
        if: inputs.build-command != ''
        working-directory: ${{ inputs.install-working-directory || inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: eval "$BUILD_COMMAND"

      - name: AWS login
        uses: ./.outcrop/.github/actions/aws-oidc-login
        with:
          role-arn: ${{ env.ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: cdk deploy
        id: deploy
        uses: ./.outcrop/.github/actions/cdk-deploy
        with:
          working-directory: ${{ inputs.working-directory }}
          env: ${{ env.DEPLOY_ENV }}
          stacks: ${{ inputs.stacks }}
          extra-context: ${{ inputs.extra-context }}

      - name: Export stack outputs
        uses: ./.outcrop/.github/actions/stack-outputs
        with:
          outputs-file: ${{ steps.deploy.outputs.outputs-file }}
          prefix: ${{ inputs.output-prefix }}
          cli-version: ${{ inputs.cli-version }}
          cli-command: ${{ inputs.cli-command }}
          working-directory: ${{ inputs.working-directory }}

      - name: Smoke test
        if: inputs.smoke-test-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          SMOKE_TEST_COMMAND: ${{ inputs.smoke-test-command }}
          CI: "true"
        run: eval "$SMOKE_TEST_COMMAND"
