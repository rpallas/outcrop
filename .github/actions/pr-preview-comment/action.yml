name: PR preview comment
description: >-
  Creates or updates a single sticky pull request comment describing the preview environment
  (status, preview id, stacks, URL, workflow run and timestamp). The comment is identified by the
  hidden marker `<!-- platform-cdk-preview -->`, so repeated runs edit the same comment. Requires
  `permissions: pull-requests: write`.

inputs:
  preview-id:
    description: Preview id shown in the comment.
    required: false
    default: ""
  stack-names:
    description: Comma separated stack names shown in the comment.
    required: false
    default: ""
  base-url:
    description: Optional URL of the preview environment.
    required: false
    default: ""
  status:
    description: One of `deployed`, `destroyed`, `failed`, `skipped`.
    required: true
  extra-markdown:
    description: Optional additional markdown appended to the comment body.
    required: false
    default: ""
  pr-number:
    description: Pull request number. Defaults to the current pull request; the step is skipped when there is none.
    required: false
    default: ${{ github.event.pull_request.number }}
  github-token:
    description: Token used to read and write issue comments.
    required: false
    default: ${{ github.token }}

outputs:
  comment-id:
    description: Id of the created or updated comment (empty when skipped).
    value: ${{ steps.comment.outputs.comment-id }}

runs:
  using: composite
  steps:
    - name: Create or update preview comment
      id: comment
      uses: actions/github-script@v7
      env:
        PREVIEW_ID: ${{ inputs.preview-id }}
        STACK_NAMES: ${{ inputs.stack-names }}
        BASE_URL: ${{ inputs.base-url }}
        STATUS: ${{ inputs.status }}
        EXTRA_MARKDOWN: ${{ inputs.extra-markdown }}
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = "<!-- platform-cdk-preview -->";
          const env = process.env;
          const prNumber = Number.parseInt(env.PR_NUMBER ?? "", 10);
          if (!Number.isFinite(prNumber)) {
            core.info("No pull request number available; skipping preview comment.");
            core.setOutput("comment-id", "");
            return;
          }

          const badges = {
            deployed: "**DEPLOYED**",
            destroyed: "**DESTROYED**",
            failed: "**FAILED**",
            skipped: "**SKIPPED**",
          };
          const status = (env.STATUS ?? "").trim().toLowerCase();
          if (!Object.hasOwn(badges, status)) {
            core.setFailed(`Unknown status '${status}' (expected deployed, destroyed, failed or skipped)`);
            return;
          }

          const code = (value) => `\`${value.replace(/`/g, "'")}\``;
          const previewId = (env.PREVIEW_ID ?? "").trim();
          const stacks = (env.STACK_NAMES ?? "")
            .split(",")
            .map((name) => name.trim())
            .filter(Boolean);
          const baseUrl = (env.BASE_URL ?? "").trim();
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const descriptions = {
            deployed: "The preview environment for this pull request is up to date.",
            destroyed: "The preview environment for this pull request has been removed.",
            failed: `The preview deployment failed - see the [workflow run](${runUrl}) for details.`,
            skipped: "Preview deployment was skipped for this pull request.",
          };

          const rows = [
            ["Status", badges[status]],
            ["Preview id", previewId ? code(previewId) : "-"],
            ["Stacks", stacks.length > 0 ? stacks.map(code).join(", ") : "-"],
            ["URL", baseUrl && status === "deployed" ? `<${baseUrl}>` : "-"],
            ["Workflow run", `[${context.runId}](${runUrl})`],
            ["Updated", new Date().toISOString()],
          ];
          const lines = [
            marker,
            "### Preview environment",
            "",
            descriptions[status],
            "",
            "| | |",
            "| --- | --- |",
            ...rows.map(([label, value]) => `| ${label} | ${value} |`),
          ];
          const extra = (env.EXTRA_MARKDOWN ?? "").trim();
          if (extra) {
            lines.push("", extra);
          }
          const body = lines.join("\n");

          const { owner, repo } = context.repo;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number: prNumber,
            per_page: 100,
          });
          const existing = comments.find((comment) => comment.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            core.info(`Updated preview comment ${existing.id} (${status}).`);
            core.setOutput("comment-id", String(existing.id));
          } else {
            const { data } = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            });
            core.info(`Created preview comment ${data.id} (${status}).`);
            core.setOutput("comment-id", String(data.id));
          }
